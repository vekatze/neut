name: Tests on macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'test/**'
              - 'build/**'
              - 'stack.yaml*'
              - '.justfile'
              - '.github/workflows/macos.yaml'

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: extractions/setup-just@v1
      - uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: '3.11.1'
          stack-no-global: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('**/stack.yaml', '**/build/package.template.yaml') }}
          restore-keys: |
            ${{ runner.os }}-stack-
      - uses: actions/cache/restore@v4
        id: cache-llvm
        with:
          path: cache/llvm/out
          key: ${{ runner.os }}-${{ runner.arch }}-llvm-${{ hashFiles('build/llvm.just') }}
      - name: Identify the macOS build settings for curl
        id: curl-config
        run: |
          sdk_path=$(xcrun --show-sdk-path)
          sdk_build=$(xcrun --show-sdk-build-version 2>/dev/null || echo unknown)
          deployment_target=$(just --evaluate macos-deployment-target)
          config_hash=$(printf '%s\n' "$sdk_path" "$sdk_build" "$deployment_target" | shasum -a 256 | cut -d ' ' -f 1)
          echo "hash=$config_hash" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cache-curl
        with:
          path: cache/curl/out/arm64-darwin
          key: ${{ runner.os }}-${{ runner.arch }}-curl-${{ hashFiles('build/curl.just') }}-${{ steps.curl-config.outputs.hash }}
      - uses: actions/cache/restore@v4
        id: cache-fetched
        with:
          path: |
            cache/wasi
            cache/binaryen
          key: ${{ runner.os }}-${{ runner.arch }}-fetched-${{ hashFiles('build/wasi.just', 'build/binaryen.just') }}
      - uses: actions/cache/restore@v4
        id: cache-mimalloc
        with:
          path: cache/mimalloc
          key: ${{ runner.os }}-${{ runner.arch }}-mimalloc-${{ hashFiles('build/mimalloc.just', 'build/llvm.just', 'build/wasi.just') }}
      - run: just build-compiler-arm64-darwin
      - uses: actions/cache/save@v4
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        with:
          path: cache/llvm/out
          key: ${{ runner.os }}-${{ runner.arch }}-llvm-${{ hashFiles('build/llvm.just') }}
      - uses: actions/cache/save@v4
        if: steps.cache-curl.outputs.cache-hit != 'true'
        with:
          path: cache/curl/out/arm64-darwin
          key: ${{ steps.cache-curl.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: steps.cache-fetched.outputs.cache-hit != 'true'
        with:
          path: |
            cache/wasi
            cache/binaryen
          key: ${{ runner.os }}-${{ runner.arch }}-fetched-${{ hashFiles('build/wasi.just', 'build/binaryen.just') }}
      - uses: actions/cache/save@v4
        if: steps.cache-mimalloc.outputs.cache-hit != 'true'
        with:
          path: cache/mimalloc
          key: ${{ runner.os }}-${{ runner.arch }}-mimalloc-${{ hashFiles('build/mimalloc.just', 'build/llvm.just', 'build/wasi.just') }}
      - run: NEUT_TEST_JOBS=4 just test-arm64-darwin
